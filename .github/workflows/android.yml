name: Build Aviator Scanner APK

on: 
    workflow-dispatch:
  push:
    branches: [ main ]
  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4 
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
          java-version:'17' 

        
    - uses: gradle/action/setup-gradle@v4 
        
    - name: build apk
      run: gradle assembleDebug
    
    - name: Upload apk
      run: actions/upload-artifact@v4
    - name: aviatorscanner apk
      run: app/build/outputs/apk/debug/*.app
