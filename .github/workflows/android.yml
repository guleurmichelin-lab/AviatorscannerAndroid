name: Build Aviator Scanner APK

on: 
    workflow-dispatch:
   push:
    branches:
    - main
  

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name:checkout repository
      uses:actions/checkout@v4
      
    - name:set up java 17
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
         java-version:'17' 

    - name:set up gradle   
    - uses:gradle/actions/setup-gradle@v4
        
    - name: build apk
      run: |
         chmod+×gradlew
         ./gradlew assembleDebug
    
    - name: Upload apk
      uses: actions/upload-artifact@v4
      with:
    - name: aviatorscanner apk
      path: app/build/outputs/apk/debug/*.app
